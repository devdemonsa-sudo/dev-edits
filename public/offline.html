<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <title>RepasseCheck offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }

      main {
        width: min(100%, 430px);
      }

      span {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.18);
        font-weight: 900;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: 2.4rem;
        line-height: 1;
      }

      p {
        margin: 0;
        color: rgba(255, 255, 255, 0.78);
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <span>RC</span>
      <h1>Voce esta offline.</h1>
      <p>Reconecte a internet para acessar imports, transacoes e relatorios da RepasseCheck.</p>
    </main>
  </body>
</html>
